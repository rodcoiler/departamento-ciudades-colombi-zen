# This file stores configurations for your Shopify app.
# Replace client_id with your app's Client ID from the Partner Dashboard.
client_id = ""
name = "Departamentos y Ciudades de Colombia"
handle = "departamentos-ciudades-colombia"
application_url = "https://departamentos-ciudades-colombia.codigozen.com"
embedded = true

[build]
include_config_on_deploy = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_orders,read_shipping,write_shipping"

[auth]
redirect_urls = [
  "https://departamentos-ciudades-colombia.codigozen.com/auth/callback",
  "https://departamentos-ciudades-colombia.codigozen.com/auth/shopify/callback",
  "https://departamentos-ciudades-colombia.codigozen.com/api/auth/callback"
]

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

[pos]
embedded = false
